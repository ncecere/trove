services:
  trove:
    image: ghcr.io/ncecere/trove:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - trove-data:/data
      - type: bind
        source: ${TROVE_MEDIA_PATH:?Set TROVE_MEDIA_PATH to your media folder}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  trove-data:
